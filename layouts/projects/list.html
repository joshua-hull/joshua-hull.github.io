{{ define "main" }}
  <article class="page">
    <div class="wrap wrap-lg">
      <header class="page-head">
        <h1 class="page-title">{{ .Title }}</h1>
        {{- with .Content }}<div class="page-lede">{{ . }}</div>{{ end }}
      </header>
      {{ partial "project-cards.html" (dict "pages" .Pages.ByDate.Reverse "level" 2) }}
    </div>
  </article>
{{ end }}
