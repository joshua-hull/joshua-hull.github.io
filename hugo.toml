baseURL = "https://joshua-hull.is-a.dev"
title = "Joshua Hull"
languageCode = "en"
defaultContentLanguage = "en"
enableRobotsTXT = true

# No posts yet, so every taxonomy page renders empty. Delete this line to
# bring /tags/, /categories/, /series/ and /authors/ back when there are.
disableKinds = ["taxonomy", "term"]

# Hugo warns (it does not fail) when the running binary does not satisfy this,
# which is enough to catch a mismatch locally. The actual pin lives in
# .tool-versions, which CI and the devcontainer both read. `extended` is kept
# because that is what CI installs, though nothing needs it now that the site
# ships plain CSS rather than the old theme's SCSS.
[module]
  [module.hugoVersion]
    min = "0.145.0"
    extended = true

[params]
author = "Joshua Hull"
description = "Senior software engineer in the Upstate of South Carolina. Notes on the things I build."
keywords = "Joshua Hull, software engineer, full stack developer, C#, Blazor, .NET, React, Python, Kubernetes, South Carolina"
# Social preview card (1200x630). Hugo's internal opengraph/twitter_cards
# templates fall back to this when a page sets no image of its own.
# Regenerate from tools/og-card.html -- see the comment in that file.
images = ["images/og-image.png"]
info = ["Senior Software Engineer"]
since = 2025

# Safari pinned-tab icon tint, read by head.html.
mask_icon_color = "#246EB9"

[taxonomies]
category = "categories"
series = "series"
tag = "tags"
author = "authors"

[[params.social]]
name = "GitHub"
icon = "github"
weight = 1
url = "https://github.com/joshua-hull/"

[[params.social]]
name = "X"
icon = "x"
weight = 2
url = "https://x.com/joshua_hull/"

[[params.social]]
name = "LinkedIn"
icon = "linkedin"
weight = 3
url = "https://www.linkedin.com/in/joshua-hull-25551624/"

[languages.en]

[[languages.en.menu.main]]
name = "About"
weight = 1
url = "about/"

